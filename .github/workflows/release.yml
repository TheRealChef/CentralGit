# Builds the installer and publishes it as a GitHub Release.
# Trigger: push a version tag, e.g.  git tag v0.1.5 && git push origin v0.1.5
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        id: version
        shell: powershell
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test CentralGit.slnx -m:1

      # Previous release's packages, so vpk can build a small delta update. Nothing to fetch the first time.
      - name: Download previous release
        continue-on-error: true
        run: |
          dotnet tool restore
          dotnet vpk download github --repoUrl https://github.com/${{ github.repository }} --channel win --outputDir artifacts/releases --token ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer
        shell: powershell
        run: .\installer\build.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: CentralGit ${{ steps.version.outputs.value }}
          # The setup exe for people, plus Velopack's feed (releases.win.json + packages) for in-app updates.
          files: |
            artifacts/setup/CentralGit-Setup-${{ steps.version.outputs.value }}.exe
            artifacts/releases/releases.win.json
            artifacts/releases/CentralGit-${{ steps.version.outputs.value }}-*.nupkg
          generate_release_notes: true
          body: |
            Download **CentralGit-Setup-${{ steps.version.outputs.value }}.exe** below and run it.
            It installs CentralGit for your account (no admin needed), or updates an existing installation.
